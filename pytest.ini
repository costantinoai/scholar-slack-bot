[pytest]
# Pytest configuration for scholar-slack-bot

# Only collect tests from the tests/ directory
testpaths = tests

# Python files to consider as test modules
python_files = test_*.py

# Python classes to consider as test classes
python_classes = Test*

# Python functions to consider as test functions
python_functions = test_*

# Ignore source files that happen to have test_ prefixed functions
# (these are not actual tests, just unfortunately named functions)
# Note: collect_ignore should contain paths relative to the config file
norecursedirs = .git __pycache__ .pytest_cache

# Minimum version
minversion = 7.0

# Show extra test summary info
addopts =
    --strict-markers
    --tb=short
    --disable-warnings

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
