<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scholar Slack Bot{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com" onerror="console.error('Tailwind CSS failed to load')"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" onerror="console.error('HTMX failed to load')"></script>

    <!-- Chart.js for statistics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" onerror="console.error('Chart.js failed to load')"></script>

    <!-- Debug: Log when scripts are loading -->
    <script>
        console.log('===== Scholar Bot UI Loading =====');
        console.log('Location:', window.location.href);
        console.log('User Agent:', navigator.userAgent);
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM Content Loaded');
            console.log('HTMX available:', typeof htmx !== 'undefined');
            console.log('Tailwind loaded:', document.querySelector('script[src*="tailwindcss"]') !== null);
        });
    </script>

    <!-- Custom CSS -->
    <style>
        /* Loading spinner animation */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }

        /* Safety: ensure Tailwind's `hidden` class effect exists even if CDN fails. */
        .hidden { display: none !important; }

        /* Safety: prevent any full-screen overlay from blocking clicks by default. */
        #loading-overlay { display: none; pointer-events: none; }

        /* Smooth transitions */
        .transition-all {
            transition: all 0.3s ease;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full">
    <div class="min-h-full">
        <!-- Sidebar -->
        <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-gradient-to-b from-blue-900 to-blue-800 transform transition-transform duration-300 ease-in-out">

            <!-- Logo/Header -->
            <div class="flex items-center justify-between h-16 px-6 bg-blue-950">
                <div class="flex items-center">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span class="ml-2 text-xl font-bold text-white">Scholar Bot</span>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Navigation -->
            <nav class="mt-6 px-3">
                <a href="/" class="flex items-center px-4 py-3 mb-2 text-white bg-blue-800 rounded-lg hover:bg-blue-700 transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Dashboard
                </a>

                <a href="/authors" class="flex items-center px-4 py-3 mb-2 text-blue-100 rounded-lg hover:bg-blue-700 transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    Authors
                </a>

                <a href="/publications" class="flex items-center px-4 py-3 mb-2 text-blue-100 rounded-lg hover:bg-blue-700 transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    Publications
                </a>

                <a href="/plugins" class="flex items-center px-4 py-3 mb-2 text-blue-100 rounded-lg hover:bg-blue-700 transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14v6m-3-3h6M6 10h2a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2zm10 0h2a2 2 0 002-2V6a2 2 0 00-2-2h-2a2 2 0 00-2 2v2a2 2 0 002 2zM6 20h2a2 2 0 002-2v-2a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2z"/>
                    </svg>
                    Plugins
                </a>
                <a href="/settings" class="flex items-center px-4 py-3 mb-2 text-blue-100 rounded-lg hover:bg-blue-700 transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0-6a2 2 0 012 2v1.09a7.95 7.95 0 013.45 2l.77-.77a2 2 0 112.83 2.83l-.77.77a7.95 7.95 0 012 3.45H22a2 2 0 110 4h-1.09a7.95 7.95 0 01-2 3.45l.77.77a2 2 0 11-2.83 2.83l-.77-.77a7.95 7.95 0 01-3.45 2V22a2 2 0 11-4 0v-1.09a7.95 7.95 0 01-3.45-2l-.77.77a2 2 0 11-2.83-2.83l.77-.77a7.95 7.95 0 01-2-3.45H2a2 2 0 110-4h1.09a7.95 7.95 0 012-3.45l-.77-.77a2 2 0 112.83-2.83l.77.77a7.95 7.95 0 013.45-2V2a2 2 0 012-2z"/>
                    </svg>
                    Settings
                </a>
            </nav>

            <!-- Bottom section -->
            <div class="absolute bottom-0 w-64 p-4 bg-blue-950">
                <div class="flex items-center justify-between text-blue-100 text-sm">
                    <span>v1.0.0</span>
                    <button onclick="toggleDarkMode()" class="p-2 rounded hover:bg-blue-900">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main content area -->
        <div id="main-content" class="transition-all duration-300 lg:pl-64">
            <!-- Top navbar -->
            <div class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
                <div class="flex items-center justify-between h-16 px-4 sm:px-6 lg:px-8">
                    <button onclick="toggleSidebar()" class="text-gray-500 hover:text-gray-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>

                    <div class="flex items-center space-x-4">
                        <!-- Search bar -->
                        <div class="hidden md:block">
                            <input type="search" placeholder="Search publications..."
                                   class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <!-- Notifications -->
                        <button class="relative p-2 text-gray-500 hover:text-gray-700">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                            </svg>
                            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>

                        <!-- User menu -->
                        <div class="flex items-center">
                            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-semibold">
                                U
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Page content -->
            <main class="px-4 py-8 sm:px-6 lg:px-8">
                <!-- Toast notifications container -->
                <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="htmx-indicator fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
            <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-gray-700 font-medium">Loading...</span>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script>
        console.log('===== JavaScript Functions Loading =====');

        // Sidebar toggle
        let sidebarOpen = true;
        function toggleSidebar() {
            console.log('toggleSidebar called, current state:', sidebarOpen);
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');

            if (sidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                mainContent.classList.add('lg:pl-64');
            } else {
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.remove('lg:pl-64');
            }
            console.log('Sidebar toggled to:', sidebarOpen);
        }
        console.log('toggleSidebar function defined');

        // Dark mode toggle
        function toggleDarkMode() {
            console.log('toggleDarkMode called');
            document.body.classList.toggle('dark');
            // You can add localStorage persistence here if needed
        }
        console.log('toggleDarkMode function defined');

        // Toast notification function
        function showToast(message, type = 'success') {
            console.log('showToast called:', message, type);
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            };

            toast.className = `${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 transform transition-all duration-300 translate-x-full`;
            toast.innerHTML = `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <span>${message}</span>
            `;

            document.getElementById('toast-container').appendChild(toast);

            // Animate in
            setTimeout(() => toast.classList.remove('translate-x-full'), 100);

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        console.log('showToast function defined');

        // HTMX event listeners
        console.log('Setting up HTMX event listeners');
        document.body.addEventListener('htmx:afterSwap', function(event) {
            console.log('HTMX afterSwap event fired');
            if (event.detail.successful) {
                showToast('Action completed successfully');
            }
        });

        document.body.addEventListener('htmx:responseError', function(event) {
            console.log('HTMX responseError event fired');
            showToast('Error: ' + event.detail.error, 'error');
        });

        // Ensure the loading overlay cannot trap clicks
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.display = 'none';
                overlay.style.pointerEvents = 'none';
            }
        });

        // Optional: wire up HTMX to show/hide the overlay without blocking clicks
        if (typeof document !== 'undefined') {
            document.body.addEventListener('htmx:beforeRequest', () => {
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.style.display = 'flex';
                    overlay.style.pointerEvents = 'none'; // do not block interaction
                }
            });
            document.body.addEventListener('htmx:afterRequest', () => {
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.style.display = 'none';
                    overlay.style.pointerEvents = 'none';
                }
            });
        }

        console.log('===== All JavaScript Functions Loaded =====');
        console.log('Available functions:', {
            toggleSidebar: typeof toggleSidebar,
            toggleDarkMode: typeof toggleDarkMode,
            showToast: typeof showToast
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
